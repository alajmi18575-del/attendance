<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حضور الوافدين</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الحضور">
<meta name="theme-color" content="#0a6a5c">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<style>
/* Layout: one column. Sticky header with four tabs (تسجيل، الحضور، التقرير، الكروت). The report tab holds a wide day-grid inside its own scroller. */
:root{
  --bg:#edf1f2; --surface:#ffffff; --ink:#14232b; --muted:#5b6c74; --line:#d5dde0; --off:#e4e9eb;
  --accent:#0a6a5c; --on-accent:#ffffff;
  --ok:#17803d; --ok-bg:#e2f4e8; --bad:#b3261e; --bad-bg:#fbe7e5; --warn:#8a5a00; --warn-bg:#fdf0d5;
  --leave:#1d5fa8; --leave-bg:#e0ecfa; --sick:#7b3f9e; --sick-bg:#f0e4f7;
  --font-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e171b; --surface:#16232a; --ink:#e4edef; --muted:#93a6ad; --line:#2a3b43; --off:#1d2d34;
    --accent:#47bfa3; --on-accent:#06231d;
    --ok:#5fd08a; --ok-bg:#12301f; --bad:#ff8f86; --bad-bg:#3a1a18; --warn:#f0c060; --warn-bg:#35290d;
    --leave:#8fbdf2; --leave-bg:#14283f; --sick:#d3a6ee; --sick-bg:#2c1a3a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e171b; --surface:#16232a; --ink:#e4edef; --muted:#93a6ad; --line:#2a3b43; --off:#1d2d34;
  --accent:#47bfa3; --on-accent:#06231d;
  --ok:#5fd08a; --ok-bg:#12301f; --bad:#ff8f86; --bad-bg:#3a1a18; --warn:#f0c060; --warn-bg:#35290d;
  --leave:#8fbdf2; --leave-bg:#14283f; --sick:#d3a6ee; --sick-bg:#2c1a3a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font:15px/1.6 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 28px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:720px;margin-inline:auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding-block:14px 0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:20px;font-weight:700}
h2{margin:0;font-size:15px;font-weight:700}
.date{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:2px;margin-top:10px;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:inherit;font-weight:500;padding:10px 2px;cursor:pointer;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
main{padding-top:16px;display:flex;flex-direction:column;gap:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:8px 18px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stats{display:flex;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.stat{flex:1;padding:10px 12px;text-align:center}
.stat+.stat{border-inline-start:1px solid var(--line)}
.stat b{display:block;font:500 24px/1.2 var(--font-num)}
.stat span{font-size:12px;color:var(--muted)}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)}
.shoot{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--accent);color:var(--on-accent);border-radius:16px;padding:22px 16px;font-size:18px;font-weight:700;cursor:pointer}
.shoot svg{width:30px;height:30px;flex:none}
.hint{margin:0;color:var(--muted);font-size:13px}
.result{border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;min-width:0}
.result.ok{background:var(--ok-bg);color:var(--ok)} .result.dup{background:var(--warn-bg);color:var(--warn)} .result.bad{background:var(--bad-bg);color:var(--bad)}
.result .t{font-weight:700} .result .s{color:var(--ink);font-size:14px;overflow-wrap:anywhere}
.mono{font-family:var(--font-num);direction:ltr;unicode-bidi:isolate}
.manual{display:flex;gap:8px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.manual input{flex:1}
.btn{font:inherit;font-weight:700;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:10px;padding:9px 16px;cursor:pointer}
.btn.ghost{background:none;color:var(--accent)}
.btn.small{padding:5px 12px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad);background:none}
.btn:disabled{opacity:.5}
.list{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.sitehead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;background:var(--off);font-weight:700;font-size:14px}
.sitehead span{font-weight:500;font-size:12.5px;color:var(--muted)}
.person{display:flex;align-items:center;gap:10px;padding:11px 14px;min-width:0}
.person+.person{border-top:1px solid var(--line)}
.person .who{flex:1;min-width:0}
.person .n{font-weight:500;overflow-wrap:anywhere}
.person .m{font-size:12.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.p{background:var(--ok-bg);color:var(--ok)} .pill.a{background:var(--bad-bg);color:var(--bad)}
.pill.l{background:var(--leave-bg);color:var(--leave)} .pill.s{background:var(--sick-bg);color:var(--sick)} .pill.o{background:var(--off);color:var(--muted)}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;background:var(--line);color:var(--muted);display:inline-grid;place-items:center;font-weight:700}
.av.big{width:72px;height:72px;border-radius:12px;font-size:28px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:14px;align-items:center;min-width:0}
.card .qr{width:104px;height:104px;flex:none;background:#fff;border-radius:6px}
.card .qr svg{display:block;width:100%;height:100%}
form.add,form.ex{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.full{grid-column:1/-1}
form input,form select{width:100%}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px}
.msg{min-height:20px;font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.rt{border-collapse:separate;border-spacing:0;font-size:12.5px;width:max-content;min-width:100%}
.rt th,.rt td{padding:0;height:30px;min-width:27px;text-align:center;border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);font-variant-numeric:tabular-nums}
.rt th{background:var(--off);font-weight:700;position:sticky;top:0}
.rt td{height:40px}
.rt .sn{position:sticky;right:0;z-index:2;background:var(--surface);min-width:30px;width:30px;font-weight:700;color:var(--muted);border-inline-start:0}
.rt th.sn{background:var(--off);z-index:3}
.rt .nm{position:sticky;right:30px;z-index:2;background:var(--surface);min-width:160px;max-width:190px;padding:0 8px;text-align:start;white-space:nowrap;border-inline-start:1px solid var(--line);font-weight:500;line-height:1.3}
.rt .nm>div{overflow:hidden;text-overflow:ellipsis}
.rt .nm .cn{font-size:11px;color:var(--muted)}
.rt th.nm{background:var(--off);z-index:3}
.rt .sm{min-width:40px;font-weight:700}
.rt td.off,.rt th.off{background:var(--off);color:var(--muted)}
.rt td.p{background:var(--ok-bg);color:var(--ok);font-weight:700}
.rt td.h{background:var(--warn-bg);color:var(--warn);font-weight:700}
.rt td.a{background:var(--bad-bg);color:var(--bad);font-weight:700;cursor:pointer}
.rt td.l{background:var(--leave-bg);color:var(--leave);font-weight:700}
.rt td.s{background:var(--sick-bg);color:var(--sick);font-weight:700}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{font-style:normal;display:inline-block;min-width:24px;padding:0 6px;text-align:center;border-radius:6px;font-weight:700;margin-inline-end:4px}
.exrow{display:flex;gap:10px;align-items:center;padding:10px 14px;flex-wrap:wrap}
.exrow+.exrow{border-top:1px solid var(--line)}
.exrow .who{flex:1;min-width:160px}
.exrow .mono{white-space:nowrap}
@media (max-width:420px){.card{flex-direction:column;align-items:flex-start}.card .qr{width:132px;height:132px}}
@media (prefers-reduced-motion:no-preference){.result{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.4}to{transform:none;opacity:1}}}
</style>
</head>
<body>


<div class="wrap" dir="rtl" lang="ar">
  <header>
    <div class="top"><h1>حضور الوافدين</h1><span class="date" id="dateLabel"></span></div>
    <div class="tabs" id="tabs" role="tablist"></div>
  </header>
  <main id="view"></main>
</div>

<script src="adapter.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var SESS={morning:"صباحي",evening:"مسائي"}, SK={morning:"m",evening:"e"};
  var MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  var TYPES={leave:"إجازة",sick:"مرضية"};
  function pad(n){return String(n).padStart(2,"0")}
  function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function nowTime(){var d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function dim(y,m){return new Date(y,m,0).getDate()}
  function isFri(y,m,d){return new Date(y,m-1,d).getDay()===5}
  function ds(y,m,d){return y+"-"+pad(m)+"-"+pad(d)}
  var t0=todayStr();
  var S={tab:"scan",date:t0,session:(new Date().getHours()<12?"morning":"evening"),lsite:"",
    y:+t0.slice(0,4),m:+t0.slice(5,7),rsite:"",
    people:[],attM:{},ex:[],loaded:false,slow:false,last:null,busy:false,confirm:"",msg:"",canWrite:true,manual:"",
    form:{id:"",no:"",type:"leave",from:"",to:"",note:""},formMsg:""};
  var db=null, dl=null, assets=null, monthSubs={};
  var R={mode:"form",no:""};
  var CFG={company:"ساج للأعمال الرائدة",header:"",from:"06:30",to:"14:30",mode:"std"};
  try{var sv=JSON.parse(localStorage.getItem("attcfg")||"null");if(sv)Object.keys(CFG).forEach(function(k){if(typeof sv[k]==="string")CFG[k]=sv[k]})}catch(e){}
  function saveCfg(){try{localStorage.setItem("attcfg",JSON.stringify(CFG))}catch(e){}}
  var DAYN=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
  var PAPER_CSS=[
    ".paper{background:#fff;color:#111;padding:16px;border:1px solid #cfd8dc;border-radius:6px}",
    ".paper .fh1{text-align:center;font-weight:700;font-size:13px}",
    ".paper .ft{font-weight:700;font-size:15px;text-align:center;text-decoration:underline;margin:6px 0 10px}",
    ".paper .fi{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;font-size:13px;margin-bottom:10px}",
    ".paper table{width:100%;border-collapse:collapse;font-size:12px}",
    ".paper th,.paper td{border:1px solid #666;padding:2px 4px;text-align:center;height:22px;color:#111}",
    ".paper th{background:#dfe3f1}",
    ".paper tr.off td{background:#cfe0c8}",
    ".paper tr.off td.nt{color:#c0392b;font-weight:700}",
    ".paper tr.leave td.nt,.paper tr.sick td.nt{color:#1d5fa8;font-weight:700}",
    ".paper tr.abs td.nt{color:#b3261e;font-weight:700}",
    ".paper tr.part td.nt{color:#8a5a00}",
    ".paper tr.tot td{background:#eef0f6;font-weight:700}",
    ".paper .ltr{direction:ltr;unicode-bidi:isolate}",
    ".paper td.l2{text-align:start}",
    ".paper .sig{display:flex;justify-content:space-between;margin-top:14px;font-size:13px;gap:10px;flex-wrap:wrap}"
  ].join("\n");
  var PAGE_CSS=".paperwrap{overflow-x:auto}.paper td.nt[data-act]{cursor:pointer}.cfg{padding:12px 14px}.cfg summary{cursor:pointer;font-weight:700}.cfg .g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.cfg label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}.cfg .full{grid-column:1/-1}.cam{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:1/1;max-height:60vh;width:100%}.cam video{width:100%;height:100%;object-fit:cover}.cam .frame{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:14px;pointer-events:none}";

  function use(n){ try{ return (window.claude&&window.claude.use)?window.claude.use(n).catch(function(){return null}):Promise.resolve(null);}catch(e){return Promise.resolve(null)} }

  /* ---------- helpers ---------- */
  function avatar(p,big){
    var c="av"+(big?" big":"");
    return p.photo?'<img class="'+c+'" src="'+(String(p.photo).indexOf("data:")===0?esc(p.photo):"/_blob/"+esc(p.photo))+'" alt="">':'<span class="'+c+'" aria-hidden="true">'+esc((p.name||"?").trim().charAt(0))+'</span>';
  }
  function qrSvg(text){
    if(!window.qrcode) return "";
    var q=qrcode(0,"M"); q.addData(text); q.make();
    var n=q.getModuleCount(), m=4, d="";
    for(var r=0;r<n;r++)for(var c=0;c<n;c++) if(q.isDark(r,c)) d+="M"+(c+m)+" "+(r+m)+"h1v1h-1z";
    var s=n+2*m;
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+s+' '+s+'" shape-rendering="crispEdges" role="img" aria-label="QR"><rect width="'+s+'" height="'+s+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
  }
  function siteList(){var o=[];S.people.forEach(function(p){var s=p.site||"بدون موقع";if(o.indexOf(s)<0)o.push(s)});return o.sort(function(a,b){return a.localeCompare(b,"ar")})}
  function inSite(p,s){return !s||(p.site||"بدون موقع")===s}
  function byName(a,b){return String(a.name).localeCompare(String(b.name),"ar")}
  function peopleOf(site){return S.people.filter(function(p){return inSite(p,site)}).sort(byName)}
  function groups(site){
    var g=[];siteList().forEach(function(s){if(site&&s!==site)return;g.push({site:s,list:peopleOf(s)})});return g;
  }
  function recOf(no,ym){return (S.attM[ym]||{})[String(no)]}
  function timeOf(no,date,session){var r=recOf(no,date.slice(0,7)),x=r&&r.d&&r.d[date.slice(8,10)];return x&&x[SK[session]]||""}
  function exFor(no,date){for(var i=0;i<S.ex.length;i++){var e=S.ex[i];if(String(e.no)===String(no)&&e.from<=date&&date<=e.to)return e}return null}
  function dayInfo(no,y,m,d){
    var date=ds(y,m,d);
    if(isFri(y,m,d))return{k:"off"};
    var r=recOf(no,y+"-"+pad(m)),x=r&&r.d&&r.d[pad(d)];
    if(x&&(x.m||x.e))return{k:"p",m:x.m,e:x.e};
    var e=exFor(no,date);
    if(e)return{k:e.type==="sick"?"sick":"leave",ex:e};
    if(date>t0)return{k:"fut"};
    return{k:"abs"};
  }
  function ensureMonth(ym){
    if(!db||monthSubs[ym])return;
    monthSubs[ym]=db.collection("att").where("month","==",ym).onSnapshot(function(s){
      var o={};s.docs.forEach(function(d){var x=d.data();o[String(x.no)]=x});
      S.attM[ym]=o;render();
    },function(){S.msg="تعذر تحميل الحضور.";render()});
  }
  function statsFor(list,date,session){
    var p=list.filter(function(x){return timeOf(x.no,date,session)}).length;
    return '<div class="stats"><div class="stat ok"><b>'+p+'</b><span>حاضر</span></div><div class="stat bad"><b>'+(list.length-p)+'</b><span>غائب</span></div><div class="stat"><b>'+list.length+'</b><span>الكل</span></div></div>';
  }
  function segHtml(){return '<div class="seg" role="group" aria-label="الفترة">'+["morning","evening"].map(function(k){return '<button type="button" data-act="session" data-v="'+k+'" aria-pressed="'+(S.session===k)+'">'+SESS[k]+'</button>'}).join("")+'</div>'}
  function siteSelect(id,val,withAll){
    return '<select id="'+id+'" aria-label="الموقع">'+(withAll?'<option value="">كل المواقع</option>':"")+siteList().map(function(x){return '<option value="'+esc(x)+'"'+(val===x?" selected":"")+'>'+esc(x)+'</option>'}).join("")+'</select>';
  }
  function resultHtml(){
    var r=S.last; if(!r) return '<p class="hint">ما تم مسح أي كرت بعد.</p>';
    if(r.kind==="ok") return '<div class="result ok" role="status">'+avatar(r.p,true)+'<div><div class="t">✓ تم تسجيل الحضور</div><div class="s">'+esc(r.p.name)+' · <span class="mono">'+esc(r.p.no)+'</span>'+(r.p.site?' · '+esc(r.p.site):'')+'<br>'+SESS[r.session]+' · '+esc(r.time)+'</div></div></div>';
    if(r.kind==="dup") return '<div class="result dup" role="status">'+avatar(r.p,true)+'<div><div class="t">! مسجّل مسبقًا</div><div class="s">'+esc(r.p.name)+' · <span class="mono">'+esc(r.p.no)+'</span><br>سُجّل حضوره '+SESS[r.session]+' الساعة '+esc(r.time)+'</div></div></div>';
    return '<div class="result bad" role="status"><div><div class="t">✕ '+esc(r.title)+'</div><div class="s">'+esc(r.text||"")+'</div></div></div>';
  }

  /* ---------- views ---------- */
  function scanView(){
    var fri=isFri(+t0.slice(0,4),+t0.slice(5,7),+t0.slice(8,10));
    return segHtml()+
      (fri?'<div class="note">اليوم الجمعة، عطلة رسمية. ما يُسجَّل فيها حضور.</div>':"")+
      '<div id="statsw">'+(S.people.length?statsFor(S.people,t0,S.session):"")+'</div>'+
      (window.APP_LIVE_CAM?camHtml():"")+
      '<label class="shoot"><input type="file" id="cam" accept="image/*" capture="environment" hidden>'+
        '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11V6a2 2 0 0 1 2-2h5M21 4h5a2 2 0 0 1 2 2v5M28 21v5a2 2 0 0 1-2 2h-5M11 28H6a2 2 0 0 1-2-2v-5"/><path d="M9 16h14"/></svg>'+
        '<span>'+(S.busy?"جاري القراءة…":"صوّر الكرت")+'</span></label>'+

  function counts(no,y,m){

    var i=dayInfo(no,y,m,d);

      if(i.m&&i.e)return '<td class="p" title="صباحي '+esc(i.m)+' · مسائي '+esc(i.e)+'">✓</td>';

    if(i.k==="sick")return '<td class="s" title="'+esc(i.ex.note||"مرضية")+'">مر</td>';
    if(i.k==="abs")return '<td class="a" data-act="cell" data-no="'+esc(no)+'" data-d="'+ds(y,m,d)+'" title="غائب: اضغط لإدخال عذر">✕</td>';

  function t12(t){if(!t)return "";var h=+t.slice(0,2),mm=t.slice(3,5),ap=h>=12?"م":"ص";h=h%12;if(!h)h=12;return h+":"+mm+" "+ap}

  function formRows(p,y,m){
    var n=dim(y,m),rows=[],std=CFG.mode==="std";

      else if(i.k==="p"){
        r.from=i.m?t12(std?CFG.from:i.m):"";r.to=i.e?t12(std?CFG.to:i.e):"";
        if(!i.m)r.note="لم يسجّل الحضور الصباحي";else if(!i.e)r.note="لم يسجّل الحضور المسائي";

    if(!p){S.last={kind:"bad",title:"الكرت غير معروف",text:"الرقم: "+String(no).slice(0,40)};afterMark();return}
    var y=+date.slice(0,4),m=+date.slice(5,7),d=+date.slice(8,10);
    if(isFri(y,m,d)){S.last={kind:"bad",title:"اليوم عطلة",text:"الجمعة عطلة رسمية ولا يُسجَّل فيها حضور."};afterMark();return}
    if(!db){S.last={kind:"bad",title:"التسجيل غير متاح",text:"سجّل الدخول وتأكد أن عندك صلاحية الكتابة."};afterMark();return}
    var ym=date.slice(0,7),dd=pad(d),k=SK[session],ref=db.collection("att").doc(String(p.no)+"_"+ym);
    try{
      var snap=await ref.get(),cur=snap.exists?snap.data():null,day=cur&&cur.d&&cur.d[dd];
      if(day&&day[k]){S.last={kind:"dup",p:p,session:session,time:day[k]}}
      else{
        var t=nowTime();
        if(!snap.exists){var o={};o[dd]={};o[dd][k]=t;await ref.set({no:String(p.no),month:ym,site:p.site||"",d:o})}
        else{var u={site:p.site||"",d:{}};u.d[dd]={};u.d[dd][k]=t;await ref.update(u)}

      }
    }catch(e){S.last={kind:"bad",title:"ما انحفظ الحضور",text:(e&&(e.code==="invalid_argument"||e.code==="permission-denied"))?"ما عندك صلاحية التسجيل لهذا الموقع. تواصل مع المالك.":"حاول مرة ثانية."}}

  async function decode(file){
    var bmp=await createImageBitmap(file);
    var c=document.createElement("canvas"), x=c.getContext("2d",{willReadFrequently:true}), sizes=[1000,600,1600,360];
    for(var i=0;i<sizes.length;i++){
      var sc=Math.min(1,sizes[i]/Math.max(bmp.width,bmp.height)), w=Math.round(bmp.width*sc), h=Math.round(bmp.height*sc);
      c.width=w; c.height=h; x.drawImage(bmp,0,0,w,h);
      if(window.jsQR){var im=x.getImageData(0,0,w,h);var r=jsQR(im.data,w,h);if(r&&r.data)return r.data}
      if("BarcodeDetector" in window){try{var bd=new BarcodeDetector({formats:["qr_code"]});var res=await bd.detect(c);if(res[0])return res[0].rawValue}catch(e){}}
    }
    return null;
  }

      render();
    } else if(act==="xlsx")exportXlsx();
    else if(act==="rmode"){R.mode=v;render()}
    else if(act==="pdfone")exportPdf(true);
    else if(act==="pdfsite")exportPdf(false);
    else if(act==="wprev"||act==="wnext"){
      var wl=peopleOf(S.rsite==="__all"?"":S.rsite),wi=wl.findIndex(function(w){return String(w.no)===String(R.no)})+(act==="wnext"?1:-1);
      if(wl[wi]){R.no=String(wl[wi].no);render()}
    }
    else if(act==="cardsfile")exportCards();
    else if(act==="cell"){
      var dt=el.dataset.d;S.form={id:"",no:no,type:"leave",from:dt,to:dt,note:""};S.formMsg="";render();
      var f=document.getElementById("exForm");if(f&&f.scrollIntoView)f.scrollIntoView({block:"center"});
    } else if(act==="exedit"){
      var ex=S.ex.find(function(x){return x.id===el.dataset.id});
      if(ex){S.form={id:ex.id,no:ex.no,type:ex.type,from:ex.from,to:ex.to,note:ex.note||""};S.formMsg="";render();var f2=document.getElementById("exForm");if(f2&&f2.scrollIntoView)f2.scrollIntoView({block:"center"})}
    } else if(act==="exdel"){
      var kk="ex_"+el.dataset.id;
      if(S.confirm!==kk){S.confirm=kk;render();return}
      S.confirm="";
      try{await db.doc("excuses/"+el.dataset.id).delete();if(S.form.id===el.dataset.id)resetForm()}catch(err){S.formMsg="ما تم الحذف."}
      render();
    } else if(act==="exreset"){resetForm();render()}
  });
  document.addEventListener("input",function(e){
    var t=e.target;
    if(t.id==="manualNo")S.manual=t.value;
    else if(t.id==="exNote")S.form.note=t.value;
  });
  document.addEventListener("change",function(e){
    var t=e.target;
    if(t.id==="cam"){var f=t.files&&t.files[0];t.value="";if(f)onPhoto(f)}
    else if(t.id==="viewDate"){if(t.value){S.date=t.value;S.confirm="";ensureMonth(S.date.slice(0,7));render()}}
    else if(t.id==="lsite"){S.lsite=t.value;render()}
    else if(t.id==="rsite"){S.rsite=t.value;S.form.no="";R.no="";render()}
    else if(t.id==="rno"){R.no=t.value;render()}
    else if(t.id==="cfgCompany"){CFG.company=t.value;saveCfg();render()}
    else if(t.id==="cfgHeader"){CFG.header=t.value;saveCfg();render()}
    else if(t.id==="cfgFrom"&&t.value){CFG.from=t.value;saveCfg();render()}
    else if(t.id==="cfgTo"&&t.value){CFG.to=t.value;saveCfg();render()}
    else if(t.id==="cfgMode"){CFG.mode=t.value;saveCfg();render()}
    else if(t.id==="rm"){S.m=+t.value;ensureMonth(S.y+"-"+pad(S.m));render()}
    else if(t.id==="ry"){S.y=+t.value;ensureMonth(S.y+"-"+pad(S.m));render()}
    else if(t.id==="exNo")S.form.no=t.value;
    else if(t.id==="exType")S.form.type=t.value;
    else if(t.id==="exFrom"){S.form.from=t.value;if(!S.form.to||S.form.to<t.value){S.form.to=t.value;render()}}
    else if(t.id==="exTo")S.form.to=t.value;
    else if(t.classList&&t.classList.contains("photoIn")){var pf=t.files&&t.files[0],pn=t.dataset.no;t.value="";if(pf)uploadPhoto(pn,pf)}
  });
  document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="manualNo"){e.preventDefault();var b=document.querySelector('[data-act="manual"]');if(b)b.click()}});
  document.addEventListener("submit",async function(e){
    e.preventDefault();
    if(e.target.id==="exForm"){S.form.note=($("#exNote")||{}).value||S.form.note;await saveExcuse();return}
    if(e.target.id!=="addForm") return;
    var name=$("#fName").value.trim(), no=$("#fNo").value.trim(), site=$("#fSite").value.trim();
    if(!name||!/^[A-Za-z0-9_-]{1,20}$/.test(no)){S.msg="اكتب الاسم، والرقم بأرقام أو حروف إنجليزية.";render();return}
    if(S.people.some(function(p){return String(p.no)===no})){S.msg="هذا الرقم مستخدم لوافد ثاني.";render();return}
    if(!db){S.msg="الحفظ غير متاح الحين.";render();return}
    try{await db.doc("people/"+no).set({no:no,name:name,site:site});S.msg="تمت إضافة "+name+"."}
    catch(err){S.msg=(err&&err.code==="invalid_argument")?"ما عندك صلاحية الإضافة.":"ما انحفظ، حاول مرة ثانية."; if(err&&err.code==="invalid_argument")S.canWrite=false}
    render();
  });

  /* ---------- start ---------- */
  var stEl=document.createElement("style");stEl.textContent=PAPER_CSS+PAGE_CSS;document.head.appendChild(stEl);
  render();
  (async function(){
    var res=await Promise.all([use("db"),use("user"),use("downloads"),use("assets")]);
    db=res[0]; dl=res[2]; assets=res[3];
    var u=res[1]; try{ if(u&&u.canEdit&&u.canEdit()===false) S.canWrite=false }catch(e){}
    render();
    if(!db){S.loaded=true;render();return}
    var timer=setTimeout(function(){S.slow=true;render()},10000);
    db.collection("people").onSnapshot(function(s){
      clearTimeout(timer); S.slow=false; S.loaded=true;
      S.people=s.docs.map(function(d){return d.data()});
      render();
    },function(){clearTimeout(timer);S.loaded=true;S.slow=true;render()});
    db.collection("excuses").onSnapshot(function(s){
      S.ex=s.docs.map(function(d){var x=d.data();x.id=d.id;return x});
      render();
    },function(){});
    ensureMonth(t0.slice(0,7));
  })();
})();
</script>

<script>if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});</script>
